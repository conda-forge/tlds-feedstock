schema_version: 1

context:
  version: "2026102900"

package:
  name: tlds
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/t/tlds/tlds-${{ version }}.tar.gz
  sha256: 296525821ee8fa076a908c0024a23de79fb60147e302869c76226fe315a50842

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - tlds
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Automatically updated list of valid TLDs taken directly from IANA
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/kichik/tlds

extra:
  recipe-maintainers:
    - akrherz
